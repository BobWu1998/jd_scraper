# Atlanta-area + remote ML / CV / robotics roles, junior to mid-level, posted in
# roughly the last day.
#
# Preview mode is ON: results come back blurred and cost no credits. Flip
# `preview` to false (or pass --no-preview via `extra`) once the filters look right.

name: atlanta-ml

# Keyword matching: every word in a pattern must appear in the title, in any
# order, case-insensitively. "machine learning" therefore matches
# "Machine Learning Engineer" and "Engineer, Machine Learning" alike.
titles:
  - "machine learning"
  - "ML engineer"
  - "computer vision"
  - "robotics"
  - "AI"

# The API works in calendar days, not rolling hours. 1 = today and yesterday,
# which is the closest available window to "last 24 hours" and errs toward not
# missing a posting. Set 0 for strictly today only.
posted_within_days: 5

locations:
  countries: ["US"]
  patterns:
    - "Atlanta"

# Atlanta OR remote. Matching the word "Remote" in the location text missed most
# remote jobs, because their location often reads "United States" or the company
# HQ instead. This runs a second search with the actual `remote: true` flag and
# no location pattern, then merges the results.
include_remote: true

# Leave `remote` unset. Setting it here would mean "remote only" and would AND
# with the Atlanta pattern, which is the narrowing this flag exists to avoid.
# remote:

seniority:
  - junior
  - mid_level

sources:
  linkedin_only: true

limit: 10
page_size: 10

preview: true

# After the first run, only ask for postings discovered since last time, and
# exclude ids already stored -- so repeat runs don't pay for jobs you have.
# `jd search --full` overrides this for one run.
incremental: true
incremental_overlap_minutes: 60

extra: {}
