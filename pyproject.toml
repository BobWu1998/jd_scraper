[project]
name = "jd-scraper"
version = "0.1.0"
description = "Pull LinkedIn job postings via the TheirStack API, filtered by title, post time and location."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "PyYAML>=6.0",
    "tenacity>=8.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
jd = "jd_scraper.cli:app"

# Declared twice on purpose: uv installs `dependency-groups.dev` by default, while
# `pip install -e ".[dev]"` can only see optional-dependencies. Without the extra,
# pip silently warns and leaves pytest uninstalled.
[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jd_scraper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
